<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900" role="img" aria-labelledby="title description">
  <title id="title">Binance Operations Dashboard architecture overview and ERD</title>
  <desc id="description">Binance REST and WebSocket, ETL daemon, PostgreSQL, Redis, FastAPI dashboard, browser flow, recovery flow, and four PostgreSQL tables.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#121d3b"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172342"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#030711" flood-opacity=".45"/></filter>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11Z" fill="#8ea7ff"/></marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11Z" fill="#72e4b4"/></marker>
    <marker id="arrow-amber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11Z" fill="#ffd07b"/></marker>
    <style>
      .title { fill:#f3f6ff; font-family:Arial, 'Malgun Gothic', sans-serif; font-weight:700; }
      .subtitle { fill:#aebddd; font-family:Arial, 'Malgun Gothic', sans-serif; }
      .panel { fill:url(#panel); stroke:#2b3d70; stroke-width:1.5; }
      .box { fill:#111c38; stroke:#40578f; stroke-width:1.5; }
      .box-green { fill:#102b2a; stroke:#48b890; stroke-width:1.5; }
      .box-amber { fill:#33291b; stroke:#c89546; stroke-width:1.5; }
      .box-purple { fill:#262044; stroke:#8072db; stroke-width:1.5; }
      .smallbox { fill:#0d1630; stroke:#324a7d; stroke-width:1; }
      .label { fill:#f0f4ff; font-family:Arial, 'Malgun Gothic', sans-serif; font-size:22px; font-weight:700; }
      .body { fill:#c5d0eb; font-family:Arial, 'Malgun Gothic', sans-serif; font-size:17px; }
      .tiny { fill:#9fafd2; font-family:Arial, 'Malgun Gothic', sans-serif; font-size:14px; }
      .key { fill:#ffd07b; font-family:Arial, 'Malgun Gothic', sans-serif; font-size:14px; font-weight:700; }
      .field { fill:#cdd7ed; font-family:Consolas, 'Malgun Gothic', monospace; font-size:14px; }
      .head { fill:#dce5ff; font-family:Arial, 'Malgun Gothic', sans-serif; font-size:19px; font-weight:700; }
      .arrow-label { fill:#b9c8ef; font-family:Arial, 'Malgun Gothic', sans-serif; font-size:14px; font-weight:700; }
      .section { fill:#7f9eff; font-family:Arial, 'Malgun Gothic', sans-serif; font-size:16px; font-weight:700; letter-spacing:1px; }
    </style>
  </defs>

  <rect width="1800" height="1900" fill="url(#bg)"/>
  <text x="70" y="72" class="title" font-size="38">Binance Operations Dashboard — Architecture Overview</text>
  <text x="70" y="108" class="subtitle" font-size="19">BTCUSDT · ETHUSDT / Python ETL Daemon + FastAPI / PostgreSQL as the durable source of truth</text>

  <rect x="50" y="145" width="1700" height="810" rx="20" class="panel" filter="url(#shadow)"/>
  <text x="80" y="192" class="section">RUNTIME FLOW · DOCKER COMPOSE</text>

  <rect x="85" y="265" width="255" height="135" rx="14" class="box-amber"/>
  <text x="112" y="308" class="label">Binance Spot REST</text>
  <text x="112" y="340" class="body">/api/v3/klines</text>
  <text x="112" y="370" class="tiny">최초 실행·재연결 뒤</text>
  <text x="112" y="390" class="tiny">완료 1분봉 Backfill</text>

  <rect x="85" y="510" width="255" height="135" rx="14" class="box-amber"/>
  <text x="112" y="553" class="label">Binance WebSocket</text>
  <text x="112" y="585" class="body">aggTrade + kline_1m</text>
  <text x="112" y="615" class="tiny">combined stream · public API</text>

  <rect x="445" y="225" width="380" height="500" rx="18" class="box-green" filter="url(#shadow)"/>
  <text x="475" y="272" class="label">ETL Daemon · Python asyncio</text>
  <text x="475" y="300" class="tiny">service: etl · restart: unless-stopped</text>
  <rect x="475" y="330" width="320" height="78" rx="10" class="smallbox"/>
  <text x="495" y="362" class="head">1. Stream reader + bounded queue</text>
  <text x="495" y="388" class="tiny">50ms batching / Candle + Aggregate Trade</text>
  <rect x="475" y="428" width="320" height="90" rx="10" class="smallbox"/>
  <text x="495" y="460" class="head">2. Persist transaction</text>
  <text x="495" y="486" class="tiny">NUMERIC price/quantity · idempotent upsert</text>
  <text x="495" y="506" class="tiny">checkpoint update + recovery run record</text>
  <rect x="475" y="538" width="320" height="145" rx="10" class="smallbox"/>
  <text x="495" y="570" class="head">3. Failure &amp; recovery loop</text>
  <text x="495" y="596" class="tiny">REST coverage check / overlap Backfill</text>
  <text x="495" y="620" class="tiny">exception → RECONNECTING checkpoint</text>
  <text x="495" y="644" class="tiny">exponential retry (up to 60 seconds)</text>
  <text x="495" y="668" class="tiny">SIGTERM/SIGINT graceful close</text>

  <rect x="920" y="225" width="350" height="300" rx="18" class="box-purple" filter="url(#shadow)"/>
  <text x="950" y="272" class="label">PostgreSQL 17 · durable</text>
  <text x="950" y="302" class="tiny">service: postgres / named volume</text>
  <text x="950" y="340" class="body">• market_candles</text>
  <text x="950" y="370" class="body">• aggregate_trades</text>
  <text x="950" y="400" class="body">• ingestion_checkpoints</text>
  <text x="950" y="430" class="body">• ingestion_runs</text>
  <text x="950" y="480" class="tiny">유일한 영속 데이터 기준</text>

  <rect x="920" y="595" width="350" height="130" rx="18" class="box" filter="url(#shadow)"/>
  <text x="950" y="640" class="label">Redis 8 · ephemeral</text>
  <text x="950" y="670" class="tiny">Pub/Sub market events + latest snapshot</text>
  <text x="950" y="698" class="tiny">복구 기준으로 사용하지 않음</text>

  <rect x="1360" y="225" width="330" height="315" rx="18" class="box" filter="url(#shadow)"/>
  <text x="1390" y="272" class="label">FastAPI Web App</text>
  <text x="1390" y="301" class="tiny">service: web / Jinja2 + small JS</text>
  <text x="1390" y="345" class="body">GET / · /api/dashboard</text>
  <text x="1390" y="377" class="body">GET /markets/{symbol}</text>
  <text x="1390" y="409" class="body">GET /api/markets/.../history</text>
  <text x="1390" y="441" class="body">GET /events (Redis → SSE)</text>
  <text x="1390" y="492" class="tiny">PostgreSQL 조회가 표시 데이터의 기준</text>

  <rect x="1395" y="650" width="260" height="135" rx="18" class="box-green" filter="url(#shadow)"/>
  <text x="1425" y="696" class="label">Operations Browser</text>
  <text x="1425" y="727" class="tiny">Dashboard / market detail</text>
  <text x="1425" y="752" class="tiny">Canvas chart + missing shading</text>

  <path d="M340 332 H445" fill="none" stroke="#ffd07b" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="348" y="315" class="arrow-label">Klines / Backfill</text>
  <path d="M340 577 H445" fill="none" stroke="#ffd07b" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="347" y="560" class="arrow-label">live events</text>
  <path d="M825 375 H920" fill="none" stroke="#72e4b4" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="830" y="356" class="arrow-label">transaction + upsert</text>
  <path d="M825 630 H920" fill="none" stroke="#72e4b4" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="828" y="612" class="arrow-label">publish / cache</text>
  <path d="M1270 380 H1360" fill="none" stroke="#8ea7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="1275" y="361" class="arrow-label">async DB query</text>
  <path d="M1270 660 H1315 V475 H1360" fill="none" stroke="#8ea7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="1279" y="640" class="arrow-label">subscribe → SSE</text>
  <path d="M1525 540 V650" fill="none" stroke="#8ea7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="1542" y="604" class="arrow-label">HTML · API · SSE</text>

  <rect x="85" y="825" width="1605" height="90" rx="14" fill="#101f3b" stroke="#385789"/>
  <text x="112" y="860" class="head">Recovery contract</text>
  <text x="112" y="888" class="body">start / reconnect → PostgreSQL에서 최근 BOOTSTRAP_DAYS 완료 1분봉 coverage 검사 → 첫 누락 − overlap부터 REST 조회 → PK upsert → SUCCESS/FAILED 이력 기록</text>

  <rect x="50" y="995" width="1700" height="835" rx="20" class="panel" filter="url(#shadow)"/>
  <text x="80" y="1042" class="section">POSTGRESQL ERD · LOGICAL DATA MODEL</text>
  <text x="80" y="1072" class="subtitle" font-size="16">가격·수량은 NUMERIC(30,12), 시간은 UTC / 점선은 symbol 기반 논리적 연관이며 DB 외래 키는 현재 정의하지 않음</text>

  <rect x="80" y="1130" width="385" height="505" rx="14" class="box"/>
  <rect x="80" y="1130" width="385" height="55" rx="14" fill="#273d77"/>
  <text x="105" y="1165" class="head">market_candles</text>
  <text x="105" y="1215" class="key">PK  symbol · interval · open_time</text>
  <text x="105" y="1250" class="field">close_time                 BIGINT</text>
  <text x="105" y="1278" class="field">open/high/low/close_price  NUMERIC</text>
  <text x="105" y="1306" class="field">volume · quote_volume      NUMERIC</text>
  <text x="105" y="1334" class="field">trade_count                INTEGER</text>
  <text x="105" y="1362" class="field">is_closed                  BOOLEAN</text>
  <text x="105" y="1390" class="field">source_event_time          BIGINT?</text>
  <text x="105" y="1418" class="field">received_at · updated_at   TIMESTAMPTZ</text>
  <line x1="105" y1="1450" x2="440" y2="1450" stroke="#40578f"/>
  <text x="105" y="1480" class="tiny">완료 1분봉 연속성·Backfill의 기준</text>
  <text x="105" y="1506" class="tiny">동일 키의 재적재는 update (idempotent)</text>

  <rect x="495" y="1130" width="385" height="505" rx="14" class="box"/>
  <rect x="495" y="1130" width="385" height="55" rx="14" fill="#273d77"/>
  <text x="520" y="1165" class="head">aggregate_trades</text>
  <text x="520" y="1215" class="key">PK  symbol · aggregate_trade_id</text>
  <text x="520" y="1250" class="field">event_time · trade_time    BIGINT</text>
  <text x="520" y="1278" class="field">price · quantity           NUMERIC</text>
  <text x="520" y="1306" class="field">first_trade_id             BIGINT</text>
  <text x="520" y="1334" class="field">last_trade_id              BIGINT</text>
  <text x="520" y="1362" class="field">is_buyer_maker             BOOLEAN</text>
  <text x="520" y="1390" class="field">received_at                TIMESTAMPTZ</text>
  <line x1="520" y1="1450" x2="855" y2="1450" stroke="#40578f"/>
  <text x="520" y="1480" class="tiny">실시간 최근 체결 흐름 표시용</text>
  <text x="520" y="1506" class="tiny">현재 Backfill 연속성 계약의 대상은 아님</text>

  <rect x="910" y="1130" width="385" height="505" rx="14" class="box-green"/>
  <rect x="910" y="1130" width="385" height="55" rx="14" fill="#1c6654"/>
  <text x="935" y="1165" class="head">ingestion_checkpoints</text>
  <text x="935" y="1215" class="key">PK  symbol · source</text>
  <text x="935" y="1250" class="field">connection_status          VARCHAR</text>
  <text x="935" y="1278" class="field">last_event_time            BIGINT?</text>
  <text x="935" y="1306" class="field">last_persisted_at          TIMESTAMPTZ?</text>
  <text x="935" y="1334" class="field">last_error                 TEXT?</text>
  <text x="935" y="1362" class="field">reconnect_count            INTEGER</text>
  <text x="935" y="1390" class="field">updated_at                 TIMESTAMPTZ</text>
  <line x1="935" y1="1450" x2="1270" y2="1450" stroke="#48b890"/>
  <text x="935" y="1480" class="tiny">KLINE_1M / AGG_TRADE별 운영 상태</text>
  <text x="935" y="1506" class="tiny">Dashboard LIVE·STALE 계산의 원천</text>

  <rect x="1325" y="1130" width="385" height="505" rx="14" class="box-amber"/>
  <rect x="1325" y="1130" width="385" height="55" rx="14" fill="#755426"/>
  <text x="1350" y="1165" class="head">ingestion_runs</text>
  <text x="1350" y="1215" class="key">PK  id (UUID)</text>
  <text x="1350" y="1242" class="key">UQ  symbol · run_type · started_at</text>
  <text x="1350" y="1278" class="field">run_type · status          VARCHAR</text>
  <text x="1350" y="1306" class="field">range_start · range_end    BIGINT?</text>
  <text x="1350" y="1334" class="field">rows_processed             INTEGER</text>
  <text x="1350" y="1362" class="field">error_message              TEXT?</text>
  <text x="1350" y="1390" class="field">started_at · finished_at   TIMESTAMPTZ</text>
  <line x1="1350" y1="1450" x2="1685" y2="1450" stroke="#c89546"/>
  <text x="1350" y="1480" class="tiny">BACKFILL 실행 범위와 결과 이력</text>
  <text x="1350" y="1506" class="tiny">Recent recovery runs의 데이터 원천</text>

  <path d="M465 1550 H495" fill="none" stroke="#8ea7ff" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M880 1550 H910" fill="none" stroke="#72e4b4" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M1295 1550 H1325" fill="none" stroke="#ffd07b" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="80" y="1705" class="head">Data rules at a glance</text>
  <text x="80" y="1740" class="body">① 완료된 1분봉 identity = (symbol, interval, open_time)  ② Aggregate Trade identity = (symbol, aggregate_trade_id)</text>
  <text x="80" y="1772" class="body">③ PostgreSQL만 복구·영속 기준  ④ Redis는 이벤트 전달/짧은 캐시  ⑤ Backfill은 overlap을 포함해 안전하게 재적재</text>
  <rect x="80" y="1800" width="1630" height="1" fill="#314775"/>
  <text x="80" y="1860" class="tiny">Scope: current implementation · BTCUSDT, ETHUSDT · Binance Spot public market data · generated for repository documentation</text>
</svg>
