[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binance-operations-dashboard"
version = "0.1.0"
description = "Reliable Binance market-data collector and operations dashboard"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.6",
  "pydantic-settings>=2.10.0",
  "redis>=6.2.0",
  "sqlalchemy>=2.0.41",
  "uvicorn[standard]>=0.35.0",
  "websockets>=15.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
